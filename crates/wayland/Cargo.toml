[package]
name = "srdwm-wayland"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Wayland backend for srdwm: a smithay-based compositor"

[dependencies]
srdwm-core.workspace = true
srdwm-platform.workspace = true
log.workspace = true
thiserror.workspace = true
fontdue = "0.9"

[dependencies.smithay]
version = "0.7"
default-features = false
features = [
    "backend_winit",
    "backend_drm",
    "backend_libinput",
    "backend_udev",
    "backend_session_libseat",
    "renderer_gl",
    "renderer_pixman",
    "desktop",
    "wayland_frontend",
    "xwayland",
]
