[package]
name = "srdwm-windows"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Windows backend for srdwm (DWM border API + Win32 window ops)"

[dependencies]
srdwm-core.workspace = true
srdwm-platform.workspace = true
log.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
] }
