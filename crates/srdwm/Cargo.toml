[package]
name = "srdwm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "SRDWM - a cross-platform, Lua-configured window manager"

[[bin]]
name = "srdwm"
path = "src/main.rs"

[dependencies]
srdwm-core.workspace = true
srdwm-platform.workspace = true
srdwm-config.workspace = true
log.workspace = true
env_logger.workspace = true

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
srdwm-x11.workspace = true
srdwm-wayland.workspace = true

[target.'cfg(windows)'.dependencies]
srdwm-windows.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
srdwm-macos.workspace = true
